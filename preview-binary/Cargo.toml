[package]
name = "excalidraw-preview-binary"
version = "0.4.1"
edition = "2021"

[[bin]]
name = "excalidraw-preview"
path = "src/main.rs"

[dependencies]
wry = "0.55"
tao = "0.35"
axum = { version = "0.8", features = ["tokio", "macros"] }
tokio = { version = "1", features = ["full"] }
async-stream = "0.3"
hyper = "1"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
sha2 = "0.11"
rust-embed = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", features = ["json", "blocking"] }
mime_guess = "2"
dirs = "6"
open = "5"
url = "2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.17"
# Decode the embedded PNG icon to RGBA for the tao window/taskbar icon (Windows)
# and the macOS Dock tile.
image = { version = "0.25", default-features = false, features = ["png"] }
# Native menu bar (File → Save with Cmd+S/Ctrl+S, Export, Library) on the tao path.
# The Linux/GTK path keeps the in-WebView MainMenu + web Ctrl+S handler instead.
muda = "0.19"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSResponder",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSRunningApplication",
] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSGeometry"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
sha2 = "0.11"
reqwest = { version = "0.13", features = ["blocking"] }
# Build file:// URIs in the LSP tests the way a real client does, so they are
# valid and percent-encoded on every platform (not just POSIX).
url = "2"