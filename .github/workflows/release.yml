name: Release

on:
  push:
    tags:
      - 'v*'

# The default GITHUB_TOKEN is read-only when the repo's workflow permissions are
# restricted; action-gh-release needs write access to create the release + notes.
permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: excalidraw-preview
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: excalidraw-preview
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: excalidraw-preview
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: excalidraw-preview.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libglib2.0-dev libatk1.0-dev libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The webview bundle (assets/assets/*.js, *.css) is build output, not
      # committed to git, but rust-embed embeds assets/ at compile time. Build
      # the UI before cargo so the released binary actually serves the app
      # instead of an index.html referencing an absent bundle.
      - name: Build webview UI
        run: cd preview-binary/webview-src && npm ci && npm run build

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }} -p excalidraw-preview-binary

      - name: Rename to release asset convention
        shell: bash
        run: |
          ASSET="excalidraw-preview-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then ASSET="$ASSET.exe"; fi
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      # Upload this target's binary only — no body/notes here. When every matrix
      # job generated release notes, each (× re-runs) appended its own "Full
      # Changelog" line, so the body filled up with duplicates. Notes are now
      # written exactly once by the `notes` job below.
      - name: Upload binary
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Generate the changelog once and set it as the body (replacing, not
  # appending), so re-running the release for a tag never duplicates notes.
  notes:
    name: Release notes
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Generate and set release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(gh api -X POST \
            "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" --jq .body)
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --notes "$body"