name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libglib2.0-dev libatk1.0-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # rust-embed bakes assets/ in at compile time and the webview bundle isn't
      # committed, so build the UI before the tests that assert it serves
      # (embedded_assets_serve_index_bundle_and_drawing_fonts).
      - name: Build webview UI
        run: cd preview-binary/webview-src && npm ci && npm run build
      - run: cargo nextest run --profile ci
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml

  smoke-linux:
    name: Smoke (Linux/WebKitGTK, real WebView)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libglib2.0-dev libatk1.0-dev libgtk-3-dev \
            xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The smoke test opens a real WebView and loads the embedded app, so the
      # bundle (uncommitted build output) must exist before cargo compiles it in.
      - name: Build webview UI
        run: cd preview-binary/webview-src && npm ci && npm run build
      # The smoke test (`smoke_self_test_reports_all_checks_passing`) is
      # `#[ignore]`d because it opens a *real* `wry`/WebKitGTK window. Run it under
      # a virtual X display so WebKitGTK close-interception, the native→JS save
      # bridge, and external-link routing are verified on Linux on every push —
      # the gap the manual checklist used to track by hand.
      - name: Run real-WebView smoke harness under Xvfb
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            cargo nextest run --profile ci --run-ignored ignored-only smoke_self_test

  webview:
    name: Webview (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd preview-binary/webview-src && npm ci && npm run typecheck && npm test --if-present
