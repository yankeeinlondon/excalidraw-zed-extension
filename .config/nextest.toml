# The integration tests each spawn a real preview binary that binds a TCP port and
# writes a lock file. Running them concurrently causes port races ("Address already
# in use") and lock-file contention, so they share a single-threaded test group while
# the fast, server-less unit tests keep running in parallel.
[test-groups]
serial-integration = { max-threads = 1 }

[profile.default]
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }
# Integration tests spawn the preview binary; flag tests that leave orphans behind.
leak-timeout = "500ms"

[[profile.default.overrides]]
filter = 'binary_id(excalidraw-preview-binary::integration)'
test-group = 'serial-integration'

[profile.ci]
inherits = "default"
retries = 2
fail-fast = false
failure-output = "immediate-final"

[[profile.ci.overrides]]
filter = 'binary_id(excalidraw-preview-binary::integration)'
test-group = 'serial-integration'

[profile.ci.junit]
path = "junit.xml"
