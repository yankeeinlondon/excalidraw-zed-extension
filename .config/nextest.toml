[profile.default]
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }
# Integration tests spawn the preview binary; flag tests that leave orphans behind.
leak-timeout = "500ms"

[profile.ci]
inherits = "default"
retries = 2
fail-fast = false
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
