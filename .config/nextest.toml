# The integration tests each spawn a real preview binary. The binary now binds an
# ephemeral port (port 0) and reads the assigned port back from the bound socket,
# so concurrent startups no longer race for a port — the suite is safe under
# nextest's default parallel execution (and under `cargo test`'s threaded runner).
# No serial test group is needed.

[profile.default]
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }
# Integration tests spawn the preview binary; flag tests that leave orphans behind.
leak-timeout = "500ms"

[profile.ci]
inherits = "default"
retries = 2
fail-fast = false
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
