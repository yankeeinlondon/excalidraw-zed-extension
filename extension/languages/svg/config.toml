name = "SVG"
# ── TEMPORARILY GRAMMAR-LESS (2026-09-06) — diagnostic rollback ───────────────
# `grammar = "xml"` plus block_comment/brackets/tab_size/autoclose_before were
# added earlier today (decision-log D15) and coincided with `.excalidraw.svg`
# click-to-preview breaking, while bare `.excalidraw` (grammar = "json") kept
# working. Reproduced with fresh never-opened files in a clean Zed session: the
# `.excalidraw` probe spawns a preview, the `.excalidraw.svg` probe produces no
# language match, no didOpen and no log line at all. Since both languages ship
# from the same manifest and only this one regressed, the SVG-side additions are
# the suspect and this file is reverted to its last known-working form. Re-add
# them one at a time (grammar first, then block_comment — the array form here may
# not match the current LanguageConfig schema) once the preview is confirmed
# working again. Queries stay vendored in this directory for that retry.
#
# Trade-off (spec §3): claiming `svg` attaches the excalidraw-preview language
# server to EVERY .svg buffer. The LSP's `is_excalidraw_path` filename filter makes
# that an idle no-op for plain SVGs (no spawn, no preview); only *.excalidraw.svg
# files pass the guard and get a viewer. This language exists because Zed 1.18 never
# routes didOpen for compound path_suffixes, so .excalidraw.svg is only reachable by
# claiming the single-segment `svg` suffix and filtering by filename inside the LSP
# (fixes/2026-09-05-lsp-strategy/spec.md findings 3/4).
path_suffixes = ["svg"]
language_servers = ["excalidraw-preview"]
