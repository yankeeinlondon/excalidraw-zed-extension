name = "Excalidraw"
grammar = "json"
# Grammar: the bare `.excalidraw` format is a JSON document, so the language
# borrows tree-sitter-json (bundled as [grammars.json] in extension.toml — the
# registry packager rejects an undeclared grammar, and referencing another
# extension's grammar is not allowed either). This is highlighting only; there is
# no JSON language server attached, so a schema-level mistake still parses fine.
# The compound `.excalidraw.svg`/`.excalidraw.png` variants are NOT this language
# (see below) and get XML highlighting / Zed's image pane instead.
#
# Single-segment suffix ONLY: Zed 1.18 attaches a compound-suffix language to the
# buffer (the status bar shows "Excalidraw") but never routes textDocument/didOpen
# to the language server for it (spec findings 3/4,
# fixes/2026-09-05-lsp-strategy/spec.md). The single-segment `excalidraw` suffix
# goes through Zed's exact-match path, which demonstrably delivers didOpen. The
# compound variants are instead reached via the `SVG` language (which claims `svg`)
# plus the in-LSP `is_excalidraw_path` filename filter in preview-binary; see
# languages/svg/config.toml. `.excalidraw.png` stays CLI-only because Zed's image
# pane claims *.png before a buffer exists.
path_suffixes = ["excalidraw"]
language_servers = ["excalidraw-preview"]
tab_size = 2
autoclose_before = ",]}"
brackets = [
    { start = "{", end = "}", close = true, surround = true, newline = true },
    { start = "[", end = "]", close = true, surround = true, newline = true },
    { start = "\"", end = "\"", close = true, surround = true, newline = false },
]
