name = "Excalidraw"
# No grammar: this language spans JSON/SVG/PNG variants (no single grammar fits) and
# exists to claim path_suffixes + attach the excalidraw-preview language server for
# click-to-preview. A declared grammar must be bundled in extension.toml, and the
# Zed registry packager rejects an undeclared one ("grammar not found").
path_suffixes = ["excalidraw", "excalidraw.svg", "excalidraw.png"]
language_servers = ["excalidraw-preview"]
